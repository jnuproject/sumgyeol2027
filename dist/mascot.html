<main><div id="stage"><canvas id="mascot" tabindex="0" aria-label="드래그해서 돌려볼 수 있는 바람방울 3D 캐릭터"></canvas><div class="hint">좌우로 돌려보세요 · 등에는 숨결 가방</div></div><section><div class="eyebrow"><img class="brand" src="./assets/sumgyeol_symbol_blue.png" alt="숨결">SUMGYEOL FRIENDS / 01</div><h1>바람방울</h1><p>제주 바람을 닮은 작은 친구.<br>통통 걷고, 반갑게 손을 흔들어요.</p><div class="actions" aria-label="캐릭터 동작"><button data-action="idle" aria-pressed="true">쉬기</button><button data-action="walk" aria-pressed="false">걷기</button><button data-action="run" aria-pressed="false">달리기</button><button data-action="jump" aria-pressed="false">점프</button><button data-action="wave" aria-pressed="false">인사</button><button data-action="talk" aria-pressed="false">대화</button></div><a class="enter" href="./index.html?revision=mascot-r52&amp;character=wind&amp;view=booth">같이 캠퍼스 걷기 →</a><p class="note">움직이는 3D 시안 · 게임에서는 나와 숨결 안내 친구에게 적용돼요.</p><p id="error" hidden>캐릭터를 불러오지 못했어요. 새로고침 후 다시 확인해 주세요.</p></section></main>
