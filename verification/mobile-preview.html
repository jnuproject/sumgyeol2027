<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>모바일 산책 확인</title>
<style>body{margin:0;background:#edf2f5;font:14px system-ui;color:#214c64}nav{height:60px;display:flex;gap:8px;align-items:center;justify-content:center}button{min-height:44px;padding:0 16px;border:1px solid #cbdae5;background:white;border-radius:12px;color:inherit;font:inherit}button[aria-pressed=true]{background:#037eb7;color:white}#device{position:relative;margin:0 auto;overflow:hidden;border:1px solid #b7c9d5;border-radius:24px;background:white;box-shadow:0 10px 40px #163a5a22}iframe{position:absolute;left:0;top:0;border:0;transform-origin:top left;display:block}</style>
<nav><button id="portrait" aria-pressed="true">세로</button><button id="landscape" aria-pressed="false">가로</button><button id="place">부스</button><button id="avenue">산책</button><button id="photoFriend">사진 친구</button><button id="bookcamp">북캠핑</button></nav><output id="metrics" hidden></output><div id="device"><iframe id="game" title="모바일 게임" src="../dist/index.html?revision=encounters-r48&view=booth"></iframe></div>
<script>let w=390,h=844;const frame=document.getElementById('game'),device=document.getElementById('device');const view=new URLSearchParams(location.search).get('view');if(view)frame.src='../dist/index.html?revision=encounters-r48&view='+encodeURIComponent(view);function fit(){const s=Math.min(1,(innerWidth-30)/w,(innerHeight-80)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+s+')';device.style.width=w*s+'px';device.style.height=h*s+'px';}portrait.onclick=()=>{w=390;h=844;portrait.setAttribute('aria-pressed','true');landscape.setAttribute('aria-pressed','false');fit()};landscape.onclick=()=>{w=844;h=390;portrait.setAttribute('aria-pressed','false');landscape.setAttribute('aria-pressed','true');fit()};place.onclick=()=>frame.src='../dist/index.html?revision=encounters-r48&view=booth';avenue.onclick=()=>frame.src='../dist/index.html?revision=encounters-r48&view=avenue';photoFriend.onclick=()=>frame.src='../dist/index.html?revision=encounters-r48&view=campus-photo';bookcamp.onclick=()=>frame.src='../dist/index.html?revision=encounters-r48&view=bookcamp';setInterval(()=>{try{const v=frame.contentDocument.getElementById('world').dataset.verification;if(v)document.getElementById('metrics').dataset.verification=v;}catch{}},200);addEventListener('resize',fit);fit();</script></html>
